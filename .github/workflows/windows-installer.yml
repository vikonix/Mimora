name: "Windows installer"

# A version tag publishes the installer to the release of that tag.
# A manual run only builds it and keeps it as a workflow artifact.
#
# The installer carries no wheel: install.cmd installs mimora==<version> from
# PyPI. So the version must be on PyPI before the installer is built, and the
# order of a release is: upload to PyPI, then the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unpublished:
        description: "Build even if this version is not on PyPI. The installer then cannot install Mimora; it is only for checking the installer itself."
        type: boolean
        default: false

# contents: write is necessary to attach the installer to the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install uv"
        uses: astral-sh/setup-uv@v6

      - name: "Read the version and check it against the tag"
        id: meta
        shell: pwsh
        run: |
          # mimora/__init__.py is the single source of the version;
          # pyproject.toml reads it from there too.
          $match = Select-String -Path mimora\__init__.py -Pattern '^__version__ = "([^"]+)"'
          if (-not $match) {
            throw "No __version__ line in mimora/__init__.py"
          }
          $version = $match.Matches[0].Groups[1].Value
          # A tag that does not match the package version would publish an
          # installer that installs a different version than its name says.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: "Check that the version is published on PyPI"
        id: pypi
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ALLOW_UNPUBLISHED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unpublished }}
        run: |
          $url = "https://pypi.org/pypi/mimora/$env:VERSION/json"
          # PyPI can answer 404 for a short time after an upload. A run that
          # allows an unpublished version does not wait for it.
          $attempts = if ($env:ALLOW_UNPUBLISHED -eq 'true') { 1 } else { 5 }
          $published = $false
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            try {
              $release = Invoke-RestMethod -Uri $url
              # uv must get a wheel: building from an sdist needs a compiler.
              if ($release.urls | Where-Object { $_.packagetype -eq 'bdist_wheel' }) {
                $published = $true
                break
              }
              Write-Host "Attempt ${attempt}: Mimora $env:VERSION is on PyPI, but without a wheel."
            } catch {
              Write-Host "Attempt ${attempt}: Mimora $env:VERSION is not on PyPI ($($_.Exception.Message))."
            }
            if ($attempt -lt $attempts) {
              Start-Sleep -Seconds 30
            }
          }
          if ($published) {
            Write-Host "Mimora $env:VERSION is on PyPI with a wheel."
            "unpublished=false" >> $env:GITHUB_OUTPUT
          } elseif ($env:ALLOW_UNPUBLISHED -eq 'true') {
            Write-Host "::warning::Mimora $env:VERSION is not published on PyPI. This installer cannot install Mimora; use it only to check the installer itself."
            "unpublished=true" >> $env:GITHUB_OUTPUT
          } else {
            throw "Mimora $env:VERSION is not published on PyPI with a wheel. Upload it first, or start the workflow by hand with allow_unpublished to check the installer only."
          }

      - name: "Collect the installer payload"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\build | Out-Null
          # The installer carries its own uv.exe, so the user's computer does
          # not need uv or Python before the installation.
          Copy-Item (Get-Command uv).Source installer\build\uv.exe
          # The Visual C++ runtime that torch and llama-server need: a clean
          # Windows does not have it.
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\build\vc_redist.x64.exe

      - name: "Compile the installer"
        shell: pwsh
        run: |
          # Does nothing if the runner image already has Inno Setup.
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.meta.outputs.version }}" installer\mimora.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Keep the installer as a workflow artifact"
        uses: actions/upload-artifact@v4
        with:
          # A different name, so that an installer that cannot install
          # Mimora is not taken for a normal one.
          name: mimora-windows-installer${{ steps.pypi.outputs.unpublished == 'true' && '-unpublished' || '' }}
          path: installer/Output/*.exe
          if-no-files-found: error

      # The install scripts go to the same release in the same step: they
      # are served from releases/latest/download/, and a second workflow that
      # creates the same release at the same time can fail.
      - name: "Attach the installer and the install scripts to the release"
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            installer/install.ps1
            installer/install.sh
